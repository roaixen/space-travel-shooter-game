<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrono Rocket</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100vw;max-height:100vh;aspect-ratio:900/640;background:#000;box-shadow:0 0 40px #3a5cff55;image-rendering:auto}
</style>
</head>
<body>
<canvas id="c" width="900" height="640"></canvas>
<script>
"use strict";
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 900, H = 640;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

/* ---------- audio ---------- */
let AC = null;
function beep(f, d, type = 'square', v = 0.05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d);
    g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}

/* ---------- eras & species ---------- */
const ERAS = [
  { name: 'Age of Dinosaurs', year: '150,000,000 BC', bg: ['#14060a', '#6b2a12'], star: '#ffd9a0', need: 14, scene: 'dino', species: ['ptero', 'raptor'], boss: 'trex' },
  { name: 'The Great Ice Age', year: '20,000 BC', scene: 'ice', bg: ['#06121f', '#3a7ca8'], star: '#e8f8ff', need: 16, species: ['frostbat', 'icegolem'], boss: 'glacier' },
  { name: 'Pharaoh\'s Desert', year: '2500 BC', scene: 'egypt', bg: ['#1f1204', '#b0782a'], star: '#fff0c0', need: 18, species: ['scarab', 'anubis'], boss: 'pharaoh' },
  { name: 'Medieval Skies', year: '1250 AD', scene: 'medieval', bg: ['#0a0f24', '#2c3a6b'], star: '#e6ecff', need: 20, species: ['gargoyle', 'wyrm'], boss: 'dragon' },
  { name: 'Lost Atlantis', year: '9000 BC', scene: 'ocean', bg: ['#021a2a', '#0a6a86'], star: '#bff', need: 22, species: ['angler', 'nautilus'], boss: 'kraken' },
  { name: 'Cyber Century', year: '2150 AD', scene: 'cyber', bg: ['#04141a', '#0b5a66'], star: '#9ffcff', need: 24, species: ['drone', 'squid'], boss: 'mothership' },
  { name: 'Mars Colony War', year: '2600 AD', scene: 'mars', bg: ['#1c0705', '#a8331a'], star: '#ffd0c0', need: 26, species: ['tripod', 'burster'], boss: 'warpod' },
  { name: 'End of Time', year: '1,000,000 AD', scene: 'void', bg: ['#10041f', '#4a1380'], star: '#f0b8ff', need: 28, species: ['crystal', 'jelly'], boss: 'devourer' },
];
const TIER = [0, 0, 1, 1, 2, 2, 3, 3];
const SHOOTERS = new Set(['wyrm', 'drone', 'crystal', 'icegolem', 'anubis', 'angler', 'tripod', 'gargoyle', 'mini']);
const SPEC = {
  ptero:    { hp: 1, r: 22, score: 10, name: 'Pterodrone',     desc: 'Winged hunter. Swoops in waves.' },
  raptor:   { hp: 2, r: 20, score: 20, name: 'Void Raptor',    desc: 'Fast diver. Tracks your ship.' },
  gargoyle: { hp: 1, r: 18, score: 15, name: 'Stone Gargoyle', desc: 'Swarms in tight V formations.' },
  wyrm:     { hp: 3, r: 26, score: 30, name: 'Ember Wyrm',     desc: 'Spits aimed fireballs.' },
  drone:    { hp: 2, r: 20, score: 25, name: 'Sentinel Drone', desc: 'Patrols and fires straight down.' },
  squid:    { hp: 3, r: 24, score: 35, name: 'Cyber Squid',    desc: 'Homing tentacled menace.' },
  crystal:  { hp: 3, r: 24, score: 40, name: 'Prism Being',    desc: 'Fires three-way shard bursts.' },
  jelly:    { hp: 2, r: 26, score: 30, name: 'Void Jelly',     desc: 'Splits into two when destroyed.' },
  mini:     { hp: 1, r: 14, score: 5,  name: 'Jelly Spawn',    desc: '' },
  frostbat: { hp: 2, r: 18, score: 20, name: 'Frost Bat',      desc: 'Erratic zig-zag flier.' },
  icegolem: { hp: 5, r: 28, score: 45, name: 'Ice Golem',      desc: 'Armored. Blasts rings of shards.' },
  scarab:   { hp: 2, r: 18, score: 20, name: 'Solar Scarab',   desc: 'Strafes, then dives at you.' },
  anubis:   { hp: 4, r: 26, score: 40, name: 'Jackal Sentinel', desc: 'Fires triple spreads.' },
  angler:   { hp: 3, r: 24, score: 35, name: 'Abyss Angler',   desc: 'Fast, accurate shots.' },
  nautilus: { hp: 3, r: 24, score: 30, name: 'Spiral Nautilus', desc: 'Corkscrews toward you.' },
  tripod:   { hp: 5, r: 28, score: 50, name: 'War Tripod',     desc: 'Walks and fires twin beams.' },
  burster:  { hp: 2, r: 20, score: 30, name: 'Spore Burster',  desc: 'Explodes into a ring of spores.' },
};
const BOSSES = {
  trex:       { name: 'MECHA-REX',          hp: 90,  r: 60, color: '#6fbf3a' },
  glacier:    { name: 'GLACIER LEVIATHAN',  hp: 120, r: 66, color: '#8fd8ff' },
  pharaoh:    { name: 'THE GOLDEN PHARAOH', hp: 140, r: 64, color: '#e8b832' },
  dragon:     { name: 'ELDER DRAGON',       hp: 160, r: 66, color: '#c0392b' },
  kraken:     { name: 'THE KRAKEN',         hp: 185, r: 66, color: '#b0408a' },
  mothership: { name: 'THE MOTHERSHIP',     hp: 215, r: 72, color: '#4ee0f0' },
  warpod:     { name: 'WAR TITAN',          hp: 245, r: 68, color: '#d64a2a' },
  devourer:   { name: 'THE TIME DEVOURER',  hp: 320, r: 74, color: '#b06bff' },
};

const SHIPS = [
  { name: 'SCOUT',   desc: 'Twin pulse guns',                       cd: .20, trail: '#6cf' },
  { name: 'FALCON',  desc: 'Wing cannons + spread shots',           cd: .17, trail: '#ff9a2a' },
  { name: 'STRIKER', desc: 'Piercing lasers + homing missiles',     cd: .15, trail: '#3fe' },
  { name: 'NOVA',    desc: 'Plasma cannon, lasers, twin missiles',  cd: .13, trail: '#c6f' },
];

/* ---------- state ---------- */
let state = 'menu';
let era, kills, score, player, enemies, pbul, ebul, parts, pups, boss, stars, seen;
let spawnT, portalT, bannerT, bannerText, bannerSub, toast, toastT, warnT, shake, time = 0, bombs, killsForBomb;
const keys = {};

function reset() {
  era = 0; kills = 0; score = 0; bombs = 1; killsForBomb = 0;
  player = { x: W / 2, y: H - 80, hp: 100, cd: 0, mcd: 0, inv: 0, rapid: 0, triple: 0, tier: 0, power: 0, flash: 0, upT: 0 };
  enemies = []; pbul = []; ebul = []; parts = []; pups = []; boss = null;
  seen = {}; spawnT = 1; portalT = 0; toastT = 0; warnT = 0; shake = 0;
  stars = Array.from({ length: 110 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(0.3, 1.6) }));
  startEra(true);
}
function startEra(first) {
  kills = 0; boss = null; enemies = []; ebul = []; spawnT = 1.5;
  bannerText = ERAS[era].name; bannerSub = ERAS[era].year; bannerT = 3;
  if (!first) {
    player.hp = Math.min(100, player.hp + 25);
    const newShip = TIER[era] !== player.tier;
    player.tier = TIER[era]; player.power = era; player.upT = 2.5;
    toast = newShip ? `SHIP UPGRADED: ${SHIPS[player.tier].name} — ${SHIPS[player.tier].desc}` : `WEAPONS OVERCHARGED (Lv ${era + 1}): more damage, faster fire` + (era >= 4 ? ', extra shots' : ''); toastT = 5;
    for (let i = 0; i < 70; i++) { const a = rand(0, TAU), s = rand(80, 380); parts.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.5, 1.1), c: SHIPS[player.tier].trail, s: rand(2, 5) }); }
    [520, 660, 780, 1040].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle', .07), i * 110));
  }
}

/* ---------- weapons ---------- */
function pb(x, y, ang, sp, o) { const b = Object.assign({ x, y, vx: Math.sin(ang) * sp, vy: -Math.cos(ang) * sp, dmg: 1, k: 'pulse', hits: [] }, o); b.dmg *= 1 + .1 * player.power; pbul.push(b); }
function missile(x, y, ang) { pb(x, y, ang, 320, { k: 'missile', dmg: 3, homing: 1 }); }
function fire() {
  const T = player.tier, x = player.x, y = player.y;
  if (T === 0) { pb(x - 9, y - 14, 0, 620); pb(x + 9, y - 14, 0, 620); beep(780, .06, 'square', .025, -300); }
  else if (T === 1) {
    pb(x - 30, y - 6, 0, 680, { k: 'cannon', dmg: 1.5 }); pb(x + 30, y - 6, 0, 680, { k: 'cannon', dmg: 1.5 });
    pb(x - 8, y - 18, -.2, 640); pb(x + 8, y - 18, .2, 640); beep(520, .08, 'sawtooth', .03, -200);
  } else if (T === 2) {
    pb(x - 36, y + 2, 0, 950, { k: 'laser', pierce: 1 }); pb(x + 36, y + 2, 0, 950, { k: 'laser', pierce: 1 });
    pb(x, y - 30, 0, 760, { k: 'cannon', dmg: 1.5 });
    if (player.mcd <= 0) { player.mcd = .9; missile(x - 22, y + 6, -.5); missile(x + 22, y + 6, .5); }
    beep(1100, .07, 'sawtooth', .03, -700);
  } else {
    pb(x - 44, y + 4, -.03, 1050, { k: 'laser', pierce: 1 }); pb(x + 44, y + 4, .03, 1050, { k: 'laser', pierce: 1 });
    pb(x, y - 34, 0, 720, { k: 'plasma', dmg: 3, pierce: 1 });
    if (player.mcd <= 0) { player.mcd = .6; missile(x - 26, y + 6, -.7); missile(x + 26, y + 6, .7); missile(x, y - 10, 0); }
    beep(300, .12, 'sawtooth', .04, 700);
  }
  if (player.triple > 0) { pb(x - 10, y - 12, -.32, 640); pb(x + 10, y - 12, .32, 640); }
  if (player.power >= 4) { pb(x - 16, y - 8, -.5, 640, { k: 'cannon' }); pb(x + 16, y - 8, .5, 640, { k: 'cannon' }); }
  if (player.power >= 6) { pb(x - 20, y - 4, -.8, 600, { k: 'cannon' }); pb(x + 20, y - 4, .8, 600, { k: 'cannon' }); }
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'menu' || state === 'over' || state === 'win')) { reset(); state = 'playing'; beep(440, .2, 'sine', .08, 400); }
  if ((e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && state === 'playing') useBomb();
  if (e.code === 'KeyP' && (state === 'playing' || state === 'paused')) state = state === 'paused' ? 'playing' : 'paused';
});
addEventListener('keyup', e => keys[e.code] = false);
let touchX = null;
C.addEventListener('pointerdown', e => { if (state !== 'playing') { reset(); state = 'playing'; } touchX = e; });
C.addEventListener('pointermove', e => { if (e.buttons) touchX = e; });
addEventListener('pointerup', () => touchX = null);

function useBomb() {
  if (bombs <= 0) return;
  bombs--; shake = 18; beep(120, .6, 'sawtooth', .12, -80);
  ebul = [];
  for (const e of enemies) hurt(e, 6);
  if (boss) hurt(boss, 10);
  for (let i = 0; i < 60; i++) parts.push({ x: player.x, y: player.y, vx: Math.cos(i / 60 * TAU) * 500, vy: Math.sin(i / 60 * TAU) * 500, life: .7, c: '#fff', s: 4 });
}

/* ---------- spawning ---------- */
function spawnEnemy() {
  const E = ERAS[era], t = E.species[Math.random() < 0.5 ? 0 : 1];
  if (!seen[t]) { seen[t] = 1; toast = `NEW SPECIES: ${SPEC[t].name} — ${SPEC[t].desc}`; toastT = 3.5; }
  if (t === 'gargoyle') {
    const x0 = rand(120, W - 120);
    for (let i = -2; i <= 2; i++) addEnemy(t, x0 + i * 42, -30 - Math.abs(i) * 28);
  } else addEnemy(t, rand(50, W - 50), -30);
}
function addEnemy(t, x, y, extra) {
  const s = SPEC[t];
  const elite = t !== 'mini' && era >= 2 && Math.random() < .1 + era * .02;
  const hp = Math.ceil(s.hp * (1 + era * .3)) * (elite ? 2 : 1);
  enemies.push(Object.assign({ t, x, y, x0: x, hp, mhp: hp, r: s.r * (elite ? 1.15 : 1), elite, m: 1 + era * .07 + (elite ? .12 : 0), age: rand(0, 6), fire: rand(0.8, 2), dir: Math.random() < .5 ? -1 : 1, hit: 0, vx: 0 }, extra));
}
function spawnBoss() {
  const k = ERAS[era].boss, b = BOSSES[k];
  boss = { t: 'boss', kind: k, x: W / 2, y: -120, r: b.r, hp: b.hp, mhp: b.hp, age: 0, fire: 2, ring: 4, hit: 0, boss: true };
  warnT = 2.5; beep(90, 1.2, 'sawtooth', .1, 40);
}

/* ---------- damage ---------- */
function hurt(e, d) {
  e.hp -= d; e.hit = .1;
  if (e.hp > 0) { beep(300, .05, 'square', .03); return; }
  if (e.dead) return;
  e.dead = true;
  const big = e.boss;
  for (let i = 0; i < (big ? 90 : 16); i++) {
    const a = rand(0, TAU), sp = rand(40, big ? 420 : 240);
    parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.3, big ? 1.4 : .8), c: ['#ffd24a', '#ff7a2a', '#fff'][i % 3], s: rand(2, 5) });
  }
  shake = Math.max(shake, big ? 30 : 5); beep(big ? 70 : 160, big ? 1 : .2, 'sawtooth', .08, -60);
  if (e.boss) {
    score += 500 * (era + 1); boss = null; ebul = [];
    if (era === ERAS.length - 1) { state = 'win'; } else { state = 'portal'; portalT = 0; }
    return;
  }
  score += SPEC[e.t].score * (e.elite ? 2 : 1); kills++; killsForBomb++;
  if (e.t === 'burster') for (let i = 0; i < 8; i++) ebullet(e.x, e.y, i / 8 * TAU + .3, 150, 6, '#8f8');
  if (killsForBomb >= 10) { killsForBomb = 0; bombs = Math.min(3, bombs + 1); toast = 'TIME BOMB READY (press X)'; toastT = 2; }
  if (e.t === 'jelly') { addEnemy('mini', e.x - 14, e.y, { vx: -90 }); addEnemy('mini', e.x + 14, e.y, { vx: 90 }); }
  if (Math.random() < .13) pups.push({ x: e.x, y: e.y, k: ['hp', 'rapid', 'triple'][Math.floor(rand(0, 3))] });
}
function hurtPlayer(d) {
  if (player.inv > 0) return;
  player.hp -= d; player.inv = 1.2; shake = 12; beep(100, .3, 'sawtooth', .1, -40);
  if (player.hp <= 0) { player.hp = 0; state = 'over'; for (let i = 0; i < 50; i++) { const a = rand(0, TAU), s = rand(40, 300); parts.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: '#ff8a3a', s: 4 }); } }
}
function ebullet(x, y, a, sp, r = 6, c = '#ff5a5a') { sp *= 1 + era * .05; ebul.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, c }); }
const aim = (x, y) => Math.atan2(player.y - y, player.x - x);

/* ---------- update ---------- */
function update(dt) {
  time += dt;
  for (const s of stars) { s.y += s.z * (state === 'portal' ? 900 : 60) * dt; if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - 40 * dt);
  if (toastT > 0) toastT -= dt;
  if (bannerT > 0) bannerT -= dt;
  if (warnT > 0) warnT -= dt;

  if (state === 'portal') {
    portalT += dt;
    if (portalT > 3.4) { era++; state = 'playing'; startEra(false); }
    return;
  }
  if (state !== 'playing') return;

  /* player */
  const sp = 360;
  if (keys.ArrowLeft || keys.KeyA) player.x -= sp * dt;
  if (keys.ArrowRight || keys.KeyD) player.x += sp * dt;
  if (keys.ArrowUp || keys.KeyW) player.y -= sp * dt;
  if (keys.ArrowDown || keys.KeyS) player.y += sp * dt;
  if (touchX) { const r = C.getBoundingClientRect(); player.x += (((touchX.clientX - r.left) / r.width * W) - player.x) * 10 * dt; player.y += (((touchX.clientY - r.top) / r.height * H) - 60 - player.y) * 10 * dt; }
  player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 40, H - 30);
  player.inv -= dt; player.rapid -= dt; player.triple -= dt; player.cd -= dt; player.mcd -= dt; player.flash -= dt; player.upT -= dt;
  if ((keys.Space || touchX) && player.cd <= 0) {
    player.cd = SHIPS[player.tier].cd * (1 - .035 * player.power) * (player.rapid > 0 ? .5 : 1); player.flash = .07;
    fire();
  }
  if (Math.random() < .8) parts.push({ x: player.x + rand(-6, 6), y: player.y + 26, vx: rand(-18, 18), vy: rand(90, 170), life: rand(.2, .4), c: SHIPS[player.tier].trail, s: 2 + player.tier * .6 });
  const tg = boss ? enemies.concat([boss]) : enemies;
  for (const b of pbul) {
    if (b.homing) {
      let best = null, bd = 1e9;
      for (const e of tg) { if (e.dead || e.y < 0) continue; const d = (e.x - b.x) ** 2 + (e.y - b.y) ** 2; if (d < bd) { bd = d; best = e; } }
      if (best) {
        const a = Math.atan2(best.y - b.y, best.x - b.x), cur = Math.atan2(b.vy, b.vx);
        let da = a - cur; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
        const na = cur + clamp(da, -6 * dt, 6 * dt), sp = Math.min(540, Math.hypot(b.vx, b.vy) + 500 * dt);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
      if (Math.random() < .8) parts.push({ x: b.x, y: b.y, vx: rand(-20, 20), vy: rand(-20, 20), life: .3, c: '#fb5', s: 3 });
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
  pbul = pbul.filter(b => b.y > -60 && b.y < H + 30 && b.x > -30 && b.x < W + 30);

  /* spawning */
  if (!boss) {
    if (kills >= ERAS[era].need) { if (!enemies.length) spawnBoss(); }
    else { spawnT -= dt; if (spawnT <= 0 && enemies.length < 10 + era) { spawnEnemy(); spawnT = Math.max(.35, 1.05 - era * .09) + rand(0, .4); } }
  }

  /* enemies */
  const dtReal = dt;
  for (const e of enemies) {
    { const dt = dtReal * e.m;
    e.age += dt; e.hit -= dt; e.fire -= dt;
    switch (e.t) {
      case 'ptero':    e.y += 95 * dt; e.x = e.x0 + Math.sin(e.age * 2.5) * 80; break;
      case 'raptor':   e.y += 150 * dt; e.x += clamp(player.x - e.x, -1, 1) * 70 * dt; break;
      case 'gargoyle': e.y += 130 * dt; e.x = e.x0 + Math.sin(e.age * 4) * 30; break;
      case 'wyrm':
        if (e.y < 100) e.y += 70 * dt; else e.x += e.dir * 60 * dt;
        if (e.x < 60 || e.x > W - 60) e.dir *= -1;
        if (e.fire <= 0) { ebullet(e.x, e.y + 10, aim(e.x, e.y), 230, 8, '#ff9a2a'); e.fire = 1.8; }
        break;
      case 'drone':
        e.x += e.dir * 110 * dt; if (e.x < 40 || e.x > W - 40) e.dir *= -1;
        if (e.y < 150) e.y += 45 * dt; else e.y += 8 * dt;
        if (e.fire <= 0) { ebullet(e.x, e.y + 14, Math.PI / 2, 260, 5, '#7cf'); e.fire = 1.4; }
        break;
      case 'squid':    e.y += 75 * dt; e.x += (player.x - e.x) * .9 * dt; break;
      case 'crystal':
        if (e.y < 120) e.y += 50 * dt; else e.x += Math.sin(e.age) * 50 * dt;
        if (e.fire <= 0) { const a = aim(e.x, e.y); for (const d of [-.35, 0, .35]) ebullet(e.x, e.y, a + d, 230, 6, '#f6f'); e.fire = 2.2; }
        break;
      case 'jelly':    e.y += 60 * dt; e.x = e.x0 + Math.sin(e.age * 1.5) * 110; break;
      case 'mini':     e.y += 110 * dt; e.x += e.vx * dt; break;
      case 'frostbat': e.y += 115 * dt; e.x = clamp(e.x0 + Math.sin(e.age * 5.5) * 120, 20, W - 20); break;
      case 'icegolem':
        if (e.y < 110) e.y += 45 * dt; else e.x += e.dir * 45 * dt;
        if (e.x < 60 || e.x > W - 60) e.dir *= -1;
        if (e.fire <= 0) { const o = rand(0, TAU); for (let i = 0; i < 10; i++) ebullet(e.x, e.y, o + i / 10 * TAU, 150, 6, '#9df'); e.fire = 3; }
        break;
      case 'scarab':
        if (e.age < 1.2) e.x += e.dir * 230 * dt; else { e.y += 280 * dt; e.x += clamp(player.x - e.x, -1, 1) * 90 * dt; }
        if (e.x < 30 || e.x > W - 30) e.dir *= -1;
        if (e.y < 60 && e.age >= 1.2) e.y = 60;
        if (e.age < 1.2 && e.y < 70) e.y += 90 * dt;
        break;
      case 'anubis':
        if (e.y < 100) e.y += 50 * dt; else e.x += e.dir * 55 * dt;
        if (e.x < 60 || e.x > W - 60) e.dir *= -1;
        if (e.fire <= 0) { const a = aim(e.x, e.y); for (const d of [-.3, 0, .3]) ebullet(e.x, e.y + 10, a + d, 240, 6, '#fc4'); e.fire = 2; }
        break;
      case 'angler':
        if (e.y < 130) e.y += 60 * dt; else e.x += Math.sin(e.age * 1.4) * 90 * dt;
        if (e.fire <= 0) { ebullet(e.x, e.y + 10, aim(e.x, e.y), 320, 5, '#ff8'); e.fire = 1.2; }
        break;
      case 'nautilus':
        e.y += 90 * dt; e.x0 += clamp(player.x - e.x0, -1, 1) * 45 * dt;
        e.x = e.x0 + Math.sin(e.age * 3) * (40 + e.age * 20); break;
      case 'tripod':
        if (e.y < 110) e.y += 55 * dt; else e.x += e.dir * 60 * dt;
        if (e.x < 50 || e.x > W - 50) e.dir *= -1;
        if (e.fire <= 0) { ebullet(e.x - 16, e.y + 20, Math.PI / 2, 340, 5, '#f55'); ebullet(e.x + 16, e.y + 20, Math.PI / 2, 340, 5, '#f55'); e.fire = 1.1; }
        break;
      case 'burster':  e.y += 75 * dt; e.x = e.x0 + Math.sin(e.age * 2) * 80; break;
    }
    if (!SHOOTERS.has(e.t) && e.y > 0 && e.fire <= 0) { ebullet(e.x, e.y + 12, aim(e.x, e.y), 200, 5, '#f77'); e.fire = rand(2.6, 4.4); }
    }
  }
  /* boss */
  if (boss) {
    const b = boss; b.age += dt; b.hit -= dt; b.fire -= dt; b.ring -= dt;
    const target = 120; if (b.y < target) b.y += 70 * dt; else {
      const rage = b.hp < b.mhp * .25 ? 1.8 : b.hp < b.mhp * .5 ? 1.4 : 1;
      if (!b.summoned && b.hp < b.mhp * .5) {
        b.summoned = true; toast = 'The boss calls reinforcements!'; toastT = 2.5;
        for (let i = 0; i < 4; i++) addEnemy(ERAS[era].species[i % 2], 120 + i * 220, -30);
      }
      b.x = W / 2 + Math.sin(b.age * .7 * rage) * (W / 2 - 110);
      if (b.fire <= 0) {
        b.fire = 0.95 / rage;
        const a = aim(b.x, b.y), n = Math.min(9, 3 + era);
        for (let i = 0; i < n; i++) ebullet(b.x, b.y + 30, a + (i - (n - 1) / 2) * .2, 260 * Math.min(rage, 1.4), 7, BOSSES[b.kind].color);
      }
      if (b.ring <= 0) { b.ring = 3.2 / rage; const n = Math.min(32, 16 + era * 2), off = rand(0, TAU); for (let i = 0; i < n; i++) ebullet(b.x, b.y, off + i / n * TAU, 175, 6, '#ffd24a'); beep(200, .3, 'triangle', .07, 200); }
    }
  }
  /* bullets */
  for (const b of ebul) { b.x += b.vx * dt; b.y += b.vy * dt; }
  ebul = ebul.filter(b => b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30);

  /* collisions */
  const targets = boss ? enemies.concat([boss]) : enemies;
  for (const b of pbul) for (const e of targets) {
    if (e.dead || b.used || b.hits.includes(e)) continue;
    if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < (e.r + (b.k === 'plasma' ? 12 : 4)) ** 2) {
      hurt(e, b.dmg);
      if (b.pierce) b.hits.push(e); else b.used = true;
      if (b.k === 'missile') {
        for (let i = 0; i < 14; i++) { const a = rand(0, TAU), s = rand(40, 200); parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .4, c: ['#ff8', '#f84', '#fff'][i % 3], s: 3 }); }
        for (const o of targets) if (o !== e && !o.dead && (o.x - b.x) ** 2 + (o.y - b.y) ** 2 < 80 ** 2) hurt(o, 1);
      }
    }
  }
  pbul = pbul.filter(b => !b.used);
  for (const b of ebul) if ((b.x - player.x) ** 2 + (b.y - player.y) ** 2 < (b.r + 12) ** 2) { b.dead = true; hurtPlayer(12 + era); }
  ebul = ebul.filter(b => !b.dead);
  for (const e of targets) if (!e.dead && (e.x - player.x) ** 2 + (e.y - player.y) ** 2 < (e.r + 12) ** 2) { hurtPlayer(e.boss ? 28 : 20 + era); if (!e.boss) hurt(e, 99); }
  enemies = enemies.filter(e => !e.dead && e.y < H + 60);

  /* powerups */
  for (const p of pups) {
    p.y += 80 * dt;
    if ((p.x - player.x) ** 2 + (p.y - player.y) ** 2 < 28 ** 2) {
      p.got = true; beep(900, .15, 'sine', .07, 500);
      if (p.k === 'hp') player.hp = Math.min(100, player.hp + 30); else if (p.k === 'rapid') player.rapid = 8; else player.triple = 8;
    }
  }
  pups = pups.filter(p => !p.got && p.y < H + 20);
}

    X.font = '24px system-ui,sans-serif'; X.fillStyle = '#ffd24a'; X.fillText(bannerSub, W / 2, 296); X.globalAlpha = 1;
  }
  if (warnT > 0 && Math.floor(time * 5) % 2) { X.textAlign = 'center'; X.fillStyle = '#f33'; X.font = 'bold 52px system-ui,sans-serif'; X.fillText('⚠ WARNING ⚠', W / 2, 300); X.font = '22px system-ui,sans-serif'; X.fillText(BOSSES[boss ? boss.kind : ERAS[era].boss].name + ' APPROACHES', W / 2, 336); }
  if (toastT > 0) { X.textAlign = 'center'; X.font = '16px system-ui,sans-serif'; const w = X.measureText(toast).width + 30; X.fillStyle = '#000a'; X.fillRect(W / 2 - w / 2, H - 76, w, 30); X.fillStyle = '#9ff'; X.fillText(toast, W / 2, H - 55); }
}

function center(lines) {
  X.fillStyle = '#000b'; X.fillRect(0, 0, W, H); X.textAlign = 'center';
  lines.forEach(([t, s, c, y]) => { X.font = `${s}px system-ui,sans-serif`; X.fillStyle = c; X.fillText(t, W / 2, y); });
}

function draw() {
  X.save();
  if (shake > 0) X.translate(rand(-shake, shake) / 3, rand(-shake, shake) / 3);
  drawBG();
  if (state === 'portal') drawPortal();
  else if (player) {
    for (const p of pups) { X.fillStyle = p.k === 'hp' ? '#4f8' : p.k === 'rapid' ? '#ff0' : '#0ff'; X.beginPath(); X.arc(p.x, p.y, 12, 0, TAU); X.fill(); X.fillStyle = '#012'; X.font = 'bold 14px system-ui'; X.textAlign = 'center'; X.fillText(p.k === 'hp' ? '+' : p.k === 'rapid' ? 'R' : '3', p.x, p.y + 5); }
    enemies.forEach(drawEnemy); if (boss) drawBoss(boss);
    pbul.forEach(drawPBullet);
    for (const b of ebul) { X.fillStyle = b.c; X.beginPath(); X.arc(b.x, b.y, b.r, 0, TAU); X.fill(); X.fillStyle = '#fff'; X.beginPath(); X.arc(b.x, b.y, b.r / 2.5, 0, TAU); X.fill(); }
    if (state !== 'over') drawPlayer();
    for (const p of parts) { X.globalAlpha = clamp(p.life * 2, 0, 1); X.fillStyle = p.c; X.fillRect(p.x, p.y, p.s, p.s); } X.globalAlpha = 1;
    drawHUD();
  }
  X.restore();
  if (state === 'menu') center([['CHRONO ROCKET', 64, '#fff', 220], ['Fight through 8 eras of history. Elite enemies hit back. Defeat the Time Devourer.', 20, '#9cf', 270],
    ['Arrows / WASD  move      SPACE  shoot      X  time bomb      P  pause', 17, '#ccd', 340], ['Touch / mouse: hold and drag to fly and fire', 15, '#99a', 368], ['Press ENTER or SPACE to launch', 26, '#ffd24a', 450]]);
  if (state === 'paused') center([['PAUSED', 56, '#fff', 320], ['Press P to resume', 20, '#9cf', 360]]);
  if (state === 'over') center([['MISSION FAILED', 56, '#f55', 260], [`Lost in ${ERAS[era].name} (${ERAS[era].year})`, 22, '#fcc', 305], ['Score ' + score, 28, '#fff', 350], ['Press ENTER to try again', 24, '#ffd24a', 420]]);
  if (state === 'win') center([['TIME SAVED!', 64, '#7f7', 240], ['You destroyed the Time Devourer and defeated every species across history.', 19, '#cfc', 290], ['Final score ' + score, 30, '#fff', 350], ['Press ENTER to play again', 24, '#ffd24a', 420]]);
}

/* ---------- loop ---------- */
reset(); state = 'menu';
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
